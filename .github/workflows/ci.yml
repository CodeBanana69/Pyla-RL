name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install numpy toml discord.py requests

      - name: Run core tests
        run: python -m unittest tests.test_runtime_control_bridge tests.test_discord_control tests.test_remote_command_router tests.test_hub_validators tests.test_telegram_support -v
